<!DOCTYPE html>
<html>
<head>
  <title>7j Calculator</title>
</head>
<body>
  <p>Open the console (F12) to see the calculation</p>

  <button onclick="updateCalculation('1');">1</button>
  <button onclick="updateCalculation('2');">2</button>
  <button onclick="updateCalculation('3');">3</button>
  <button onclick="updateCalculation('+');">+</button>
  <button onclick="updateCalculation('-');">-</button>
  <button onclick="updateCalculation('*');">*</button>
  <button onclick="updateCalculation('/');">/</button>
  <button onclick="calculation = ''; console.log('Cleared');">Clear</button>
  <button onclick="
    calculation = String(eval(calculation));
    console.log(calculation);
  ">=</button>

  <script>
    let calculation = '';

   
    function updateCalculation(value) {
      calculation += value;
      console.log(calculation);
    }
  </script>
</body>
</html>
