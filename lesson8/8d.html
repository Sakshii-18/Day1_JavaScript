<!DOCTYPE html>
<html>
<head>
  <title>8d</title>
</head>
<body>
  <p>Open the console (F12) to see the output</p>
  <script>
    function comparePrice(product1, product2) {
      if (product1.price < product2.price) {
        return product1;
      } else {
        return product2;
      }
    }

    const product1 = {
      name: 'socks',
      price: 1090
    };

    const product2 = {
      name: 'basketball',
      price: 2095
    };

    console.log(comparePrice(product1, product2));   
    console.log(comparePrice(product2, product1));   
  </script>
</body>
</html>
