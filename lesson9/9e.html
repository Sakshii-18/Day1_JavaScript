<!DOCTYPE html>
<html>
<head>
  <title>9e</title>
</head>
<body>
  <input class="js-name-input" type="text" placeholder="Enter your name" onkeydown="
    if (event.key === 'Enter') {
      const text = document.querySelector('.js-name-input').value;
      document.querySelector('.js-message').innerHTML = `Your name is: ${text}`;
    }
  ">
  <button onclick="
    const text = document.querySelector('.js-name-input').value;
    document.querySelector('.js-message').innerHTML = `Your name is: ${text}`;
  ">Submit</button>

  <p class="js-message"></p>
</body>
</html>
